# Swar Mangal — WhatsApp gateway only (Docker).
#
# The main app + Google Sheets mirror run via PM2 (see deploy/aapanel/).
# PostgreSQL is managed by aaPanel's database panel.
#
# Usage:
#   cd deploy && cp .env.example .env   # fill in WA_* values
#   docker compose up -d --build wa-db wa-akg
#
# Dashboard (QR pairing, API key, webhook):
#   ssh -L 3080:127.0.0.1:3080 root@<vps-ip>
#   open http://localhost:3080
name: swarmangal

services:
  wa-db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${WA_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: wa_akg
    volumes:
      - wa_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${WA_MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 20

  wa-akg:
    build:
      context: https://github.com/mrifqidaffaaditya/WA-AKG.git#c7dd01a04339e4363b549beb3a41fe02cf131acb
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql://root:${WA_MYSQL_ROOT_PASSWORD}@wa-db:3306/wa_akg
      AUTH_SECRET: ${WA_AKG_AUTH_SECRET}
      BASE_URL: ${WA_AKG_PUBLIC_URL:-http://localhost:${WA_AKG_DASHBOARD_PORT:-3080}}
      NEXTAUTH_URL: ${WA_AKG_PUBLIC_URL:-http://localhost:${WA_AKG_DASHBOARD_PORT:-3080}}
      NEXT_PUBLIC_APP_URL: ${WA_AKG_PUBLIC_URL:-http://localhost:${WA_AKG_DASHBOARD_PORT:-3080}}
      NEXT_PUBLIC_API_URL: ${WA_AKG_PUBLIC_URL:-http://localhost:${WA_AKG_DASHBOARD_PORT:-3080}}/api
      AUTH_TRUST_HOST: "true"
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      BAILEYS_LOG_LEVEL: error
      NEXT_PUBLIC_SWAGGER_ENABLED: "false"
      ENABLE_AUTO_UPDATE_CHECK: "false"
      TZ: Asia/Kolkata
      LOCALE: en-IN
      ADMIN_EMAIL: ${WA_AKG_ADMIN_EMAIL}
      ADMIN_PASSWORD: ${WA_AKG_ADMIN_PASSWORD}
    command:
      - sh
      - -c
      - >-
        npx prisma db push &&
        if [ -n "$$ADMIN_EMAIL" ] && [ -n "$$ADMIN_PASSWORD" ]; then node scripts/setup-admin.js "$$ADMIN_EMAIL" "$$ADMIN_PASSWORD"; fi &&
        exec node node_modules/tsx/dist/cli.mjs src/server/index.ts
    volumes:
      - wa_data:/app/data
      - wa_uploads:/app/uploads
    depends_on:
      wa-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WA_AKG_DASHBOARD_PORT:-3080}:3000"
    # host.docker.internal only resolves automatically on Docker Desktop —
    # on the Linux VPS this is what makes the webhook URL in deploy/README.md
    # (http://host.docker.internal:3000/api/wa/webhook) reach the PM2 app
    # running on the host. Needs Docker Engine 20.10+.
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  wa_mysql:
  wa_data:
  wa_uploads:
